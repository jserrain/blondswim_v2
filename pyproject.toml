[project]
name = "blondswim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jserrain", email = "jserrain@xtec.cat" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
blondswim = "blondswim:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=blondswim --cov-report=term-missing"
markers = [
    "ca(id): lliga el test a un criteri d'acceptació CA-NNN-nn",
]

[tool.blondswim]
# Traçabilitat dels criteris d'acceptació: "avis" o "bloquejant" (AGENTS.md).
tracabilitat = "avis"

[tool.importlinter]
root_package = "blondswim"

[[tool.importlinter.contracts]]
name = "Capes Clean Architecture"
type = "layers"
layers = [
    "blondswim.interfaces",
    "blondswim.infrastructure",
    "blondswim.application",
    "blondswim.domain",
]
